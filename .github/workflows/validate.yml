name: Validate prompt pack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check contracts and local links
        run: python3 scripts/validate.py --json
      - name: Test regression detection
        run: python3 -m unittest discover -s tests -v
      - name: Compile maintenance script
        run: python3 -m py_compile scripts/validate.py scripts/compose.py
